<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planya — organiser ses vacances à plusieurs</title>
  <meta name="description" content="Planya : organisez vos vacances à plusieurs. Planning, défis, repas, souvenirs, dans un espace réservé au groupe.">
  <meta name="theme-color" content="#0c2f3a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planya">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Josefin+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="entete">
    <div class="marque"><span class="soleil" aria-hidden="true">☀</span> Planya</div>
    <div class="actions-entete">
      <button class="btn-installer" id="installer" hidden>⬇ Installer</button>
      <button class="lien" id="deconnexion" hidden>Se déconnecter</button>
    </div>
  </header>
  <dialog id="dlgInstall" aria-labelledby="titreInstall">
    <h2 id="titreInstall">Installer Planya</h2>
    <p class="info">Planya s’installe sur ton écran d’accueil et s’ouvre comme une vraie application.</p>
    <ol class="etapes" id="etapesInstall"></ol>
    <button class="btn secondaire" id="copierLien" hidden>Copier le lien de Planya</button>
    <button class="btn" id="fermerInstall">J’ai compris</button>
  </dialog>
  <main id="app" aria-live="polite">
    <p class="chargement">Chargement…</p>
  </main>
  <footer class="pied">
    <p>Vos séjours ne sont visibles que par leurs membres. Données hébergées dans l'Union européenne.</p>
  </footer>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
